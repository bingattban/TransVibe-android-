name: Import verified native library as a reviewed PR

on:
  repository_dispatch:
    types: [transvibe_native_ready]
  workflow_dispatch:
    inputs:
      native_run_id:
        description: Successful main-branch GitHub Actions run ID in TransVibe-so-
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  native-import:
    name: Validate native artifact and open Pull Request
    runs-on: ubuntu-24.04
    concurrency:
      group: native-import
      cancel-in-progress: false
    env:
      SOURCE_REPO: bingattban/TransVibe-so-
      SOURCE_RUN_ID: ${{ github.event.client_payload.run_id || inputs.native_run_id }}
      EXPECTED_SHA: ${{ github.event.client_payload.head_sha || '' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify this is a successful approved-source main build
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/${SOURCE_REPO}/actions/runs/${SOURCE_RUN_ID}" > native-run.json
          jq -e '
            .repository.full_name == "bingattban/TransVibe-so-"
            and .status == "completed"
            and .conclusion == "success"
            and .head_branch == "main"
            and .event == "push"
          ' native-run.json
          if [ -n "$EXPECTED_SHA" ]; then
            test "$(jq -r .head_sha native-run.json)" = "$EXPECTED_SHA"
          fi
      - name: Download exactly the verified ARM64 artifact
        run: |
          mkdir -p .native-incoming
          gh run download "$SOURCE_RUN_ID" \
            -R "$SOURCE_REPO" \
            -n transvibe-whisper-arm64-api26 \
            -D .native-incoming
      - name: Verify checksum, JNI source, ELF and dependencies before copying
        run: |
          python3 tools/verify_native_import.py --incoming .native-incoming --app-root app
      - name: Open a Pull Request instead of directly writing to main
        run: |
          set -euo pipefail
          branch="native/import-run-${SOURCE_RUN_ID}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/libs/arm64-v8a/libtransvibe_whisper.so app/libs/native-provenance.json
          if git diff --cached --quiet; then
            echo "Already current; no PR required."
            exit 0
          fi
          git commit -m "native: import verified ARM64 Whisper from SO run ${SOURCE_RUN_ID}"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Native: verified Whisper ARM64 (SO run ${SOURCE_RUN_ID})" \
            --body "Automated verified artifact import from **bingattban/TransVibe-so-** run ${SOURCE_RUN_ID}. Validated source JNI SHA-256, ELF ARM64, load alignment, dependencies and symbol exports. **DO NOT MERGE until Android CI and actual phone testing/owner approval.**"
