name: Android CI — tests before APK and Code On The Go handoff

on:
  pull_request:
  push:
    branches: [main, "setup/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    name: Full-source integrity gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check complete source is actually present (no misleading green build)
        run: |
          set -euo pipefail
          for required in \
            settings.gradle.kts \
            build.gradle.kts \
            app/build.gradle.kts \
            gradlew \
            gradle/wrapper/gradle-wrapper.jar \
            gradle/wrapper/gradle-wrapper.properties \
            app/src/main/AndroidManifest.xml \
            app/src/main/cpp/whisper_jni.cpp \
            app/src/main/java/com/transvibe/app/nativebridge/WhisperNativeBridge.kt \
            phase01/tests; do
            test -e "$required" || { echo "::error::Missing full-project source: $required"; exit 1; }
          done
      - name: Run local structural and data-safety regression tests
        run: |
          python3 -m unittest discover -s phase01/tests -p 'test_*.py' -v

  unit-tests:
    name: Compile and run Android JVM tests
    needs: source-gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Use hosted Android SDK, no obsolete tools package
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT/cmdline-tools"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKM="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" 'platforms;android-36' 'ndk;28.2.13676358'
      - name: Run Gradle unit tests before any APK packaging
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest

  debug-apks:
    name: Build Debug and Preview only after successful tests
    needs: unit-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Use hosted Android SDK, no obsolete tools package
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT/cmdline-tools"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKM="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" 'platforms;android-36' 'ndk;28.2.13676358'
      - name: Build two non-release Android variants
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:assemblePreview
      - name: Print factual native integration status
        run: |
          if [ -f app/libs/arm64-v8a/libtransvibe_whisper.so ]; then
            echo "PREBUILT JNI PRESENT — phone inference remains unverified."
          else
            echo "::warning::No production JNI in app/libs: any debug native fallback is DIAGNOSTIC ONLY."
          fi
      - name: Package complete source for Code On The Go GUI builds
        run: git archive --format=zip -o TransVibe-CodeOnTheGo-source.zip HEAD
      - name: Upload debug APKs and Code On The Go source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: transvibe-android-debug-preview-cogo
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/preview/*.apk
            TransVibe-CodeOnTheGo-source.zip
          if-no-files-found: error
          retention-days: 30
